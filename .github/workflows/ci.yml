name: CI

on:
  pull_request:
  push:
    branches: [main]

# 権限は読み取りのみ（docs/02_architecture.md 5章）
permissions:
  contents: read

# 同じブランチで新しい実行が始まったら、古い実行を止める
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # テスト用DB（docs/02_architecture.md 5章）。phpunit.xml が DB_DATABASE=testing を固定する
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: app
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U app -d testing"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          extensions: pdo_pgsql
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Audit dependencies
        run: composer audit

      - name: Lint (Pint)
        run: composer lint

      - name: Static analysis (Larastan)
        run: composer analyse

      - name: Test (Pest)
        run: composer test

      # content/ の教材がすべて検証を通ること（docs/02_architecture.md 5章）。DBはテスト用を使う。
      # .env は .env.example の写しで学習用DBの保護が有効なため、migrate:fresh ではなく migrate を使う
      - name: Validate content
        env:
          DB_DATABASE: testing
        run: |
          php artisan migrate --force
          php artisan lessons:import --dry-run
