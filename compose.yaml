# DB（PostgreSQL）のみをDockerで動かす。PHPはローカルで実行する（docs/02_architecture.md 4.1）
name: laravel-learning

services:
    db:
        image: postgres:18
        environment:
            POSTGRES_DB: learning
            POSTGRES_USER: app
            POSTGRES_PASSWORD: secret
        volumes:
            # 学習記録を保存する。外部ボリュームのため docker compose down -v でも削除されない
            - pgdata:/var/lib/postgresql
            # 初回起動時に learning_dev と testing を作る
            - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
        ports:
            - "127.0.0.1:${FORWARD_DB_PORT:-5432}:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U app -d learning"]
            interval: 5s
            timeout: 5s
            retries: 30

volumes:
    pgdata:
        # composer setup で docker volume create laravel-learning-pgdata により作成する
        external: true
        name: laravel-learning-pgdata
